<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Feedback Paths Studio: English learners discuss peer and AI feedback on their writing, with adaptive scaffolding, revision analysis and a teacher dashboard.">
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Feedback Paths Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout concept: a document-first writing tool. The student's page sits at the centre like a real document; feedback lives in the margin as comments; research instruments (agency metrics, coach policy) stay one click away instead of crowding the screen. */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --sunken:#F0F2EE; --ink:#151D19; --ink-2:#36423C; --muted:#6A766F; --faint:#98A29C;
  --line:#E3E7E2; --line-2:#D2D9D3;
  --accent:#1F5C4F; --accent-hover:#184A40; --accent-ink:#FFFFFF; --accent-soft:#E4EFEA;
  --ai:#4A55C2; --ai-soft:#EEF0FC; --peer:#B0701A; --peer-soft:#FBF2E3;
  --good:#1D7A54; --good-soft:#E3F3EA; --warn:#B4632A; --warn-soft:#FBEDE0; --bad:#B02A35; --bad-soft:#FBE6E8;
  --c-ack:#7C877F; --c-diff:#B0701A; --c-reason:#4A55C2; --c-eval:#7A46B0; --c-transfer:#1D7A54; --c-other:#A3ABA6;
  --ins-bg:#DDF2E6; --ins:#16704C; --del-bg:#FBE3E5; --del:#A8262F;
  --shadow-sm:0 1px 2px rgba(18,28,22,.06);
  --shadow:0 1px 2px rgba(18,28,22,.05), 0 10px 30px -16px rgba(18,28,22,.22);
  --shadow-lg:0 24px 60px -24px rgba(18,28,22,.35);
  --f:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171E1B; --sunken:#1C2420; --ink:#E7ECE9; --ink-2:#C5CFCA; --muted:#94A19A; --faint:#6E7A74;
  --line:#26302B; --line-2:#323D37;
  --accent:#7FCDB6; --accent-hover:#9ADBC7; --accent-ink:#0F1412; --accent-soft:#1D3A32;
  --ai:#9AA3F2; --ai-soft:#22264A; --peer:#E2B05A; --peer-soft:#3A2D16;
  --good:#6BD3A4; --good-soft:#163628; --warn:#EBA06A; --warn-soft:#3B2716; --bad:#F2878F; --bad-soft:#3D1C20;
  --c-ack:#9DA8A1; --c-diff:#E2B05A; --c-reason:#9AA3F2; --c-eval:#BE98EC; --c-transfer:#6BD3A4; --c-other:#7E8A84;
  --ins-bg:#163628; --ins:#6BD3A4; --del-bg:#3D1C20; --del:#F2878F;
  --shadow-sm:none; --shadow:0 0 0 1px var(--line); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.6); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171E1B; --sunken:#1C2420; --ink:#E7ECE9; --ink-2:#C5CFCA; --muted:#94A19A; --faint:#6E7A74;
  --line:#26302B; --line-2:#323D37;
  --accent:#7FCDB6; --accent-hover:#9ADBC7; --accent-ink:#0F1412; --accent-soft:#1D3A32;
  --ai:#9AA3F2; --ai-soft:#22264A; --peer:#E2B05A; --peer-soft:#3A2D16;
  --good:#6BD3A4; --good-soft:#163628; --warn:#EBA06A; --warn-soft:#3B2716; --bad:#F2878F; --bad-soft:#3D1C20;
  --c-ack:#9DA8A1; --c-diff:#E2B05A; --c-reason:#9AA3F2; --c-eval:#BE98EC; --c-transfer:#6BD3A4; --c-other:#7E8A84;
  --ins-bg:#163628; --ins:#6BD3A4; --del-bg:#3D1C20; --del:#F2878F;
  --shadow-sm:none; --shadow:0 0 0 1px var(--line); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.6); color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.muted{color:var(--muted)}
svg.i{width:16px; height:16px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

/* ---------- top bar ---------- */
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface)}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--line);
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.topbar-in{max-width:1280px; margin:0 auto; height:60px; display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:24px}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; letter-spacing:-.01em; color:var(--ink); text-decoration:none; white-space:nowrap}
.mark{display:inline-flex; gap:2px} .mark b{width:3px; height:15px; border-radius:2px; display:block}
.brand small{font-weight:500; color:var(--muted); font-size:13px}
.steps{display:flex; justify-content:center; align-items:center; gap:4px; list-style:none; margin:0; padding:0; min-width:0}
.steps li{display:flex; align-items:center; gap:4px; min-width:0}
.steps li + li::before{content:""; width:20px; height:1px; background:var(--line-2)}
.stp{display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; font-size:13px; font-weight:500; color:var(--muted); border:0; background:none; white-space:nowrap}
.stp .n{width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:600; border:1.5px solid var(--line-2); color:var(--muted)}
.stp.done{color:var(--ink-2)} .stp.done .n{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.stp.cur{color:var(--ink); font-weight:600} .stp.cur .n{border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
button.stp:hover{background:var(--sunken)}
.actions{display:flex; align-items:center; gap:8px}
.role{display:flex; background:var(--sunken); border-radius:9px; padding:3px}
.role button{border:0; background:none; padding:5px 12px; border-radius:7px; font-size:13px; font-weight:500; color:var(--muted)}
.role button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm)}
.iconbtn{display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 10px; border-radius:9px; border:1px solid var(--line); background:var(--surface); font-size:13px; font-weight:500; color:var(--ink-2)}
.iconbtn:hover{border-color:var(--line-2); background:var(--sunken)}
.ring{width:18px; height:18px}
.status{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); padding:0 4px}
.status .dot{width:7px; height:7px; border-radius:50%; background:var(--faint)}
.status .dot.on{background:var(--good)}
@media (max-width: 1080px){ .steps .lbl{display:none} .stp.cur .lbl{display:inline} .status span:last-child{display:none} }
@media (max-width: 760px){ .topbar-in{grid-template-columns:minmax(0,1fr) auto; height:auto; padding-block:10px; row-gap:8px; gap:12px} .steps{grid-column:1 / -1; order:3; justify-content:flex-start; overflow-x:auto} .brand small, .status, .iconbtn .ibl{display:none} .role button{padding:5px 9px} }

/* ---------- stage ---------- */
.stage{max-width:1280px; margin:0 auto; padding:28px max(16px, env(safe-area-inset-right,0px)) 64px max(16px, env(safe-area-inset-left,0px))}
.stagehead{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:22px; flex-wrap:wrap}
.stagehead h1{font-size:22px; font-weight:650; letter-spacing:-.02em}
.stagehead p{color:var(--muted); margin-top:4px; max-width:62ch}
.btns{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:38px; padding:0 16px; border-radius:10px; border:1px solid transparent; font-size:14px; font-weight:600; transition:background .15s, border-color .15s, transform .15s}
.btn.primary{background:var(--accent); color:var(--accent-ink)} .btn.primary:hover{background:var(--accent-hover)}
.btn.secondary{background:var(--surface); border-color:var(--line-2); color:var(--ink)} .btn.secondary:hover{background:var(--sunken)}
.btn.quiet{background:none; color:var(--muted); padding:0 10px} .btn.quiet:hover{color:var(--ink); background:var(--sunken)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.sm{height:32px; padding:0 12px; font-size:13px}
.workspace{display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:28px; align-items:start}
@media (max-width: 1040px){ .workspace{grid-template-columns:minmax(0,1fr)} }

/* ---------- document ---------- */
.doc{background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:36px clamp(20px, 5vw, 56px) 44px; min-height:520px}
.assign{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:10px; background:var(--sunken); color:var(--ink-2); font-size:13.5px; margin-bottom:28px}
.assign b{font-weight:600; color:var(--ink)}
.doc-title{font-family:var(--serif); font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:10px}
.doc-text{font-family:var(--serif); font-size:19px; line-height:1.85; color:var(--ink)}
textarea.doc-edit{display:block; width:100%; border:0; outline:0; resize:none; background:transparent; font-family:var(--serif); font-size:19px; line-height:1.85; color:var(--ink); min-height:300px; padding:0}
textarea.doc-edit::placeholder{color:var(--faint)}
.doc-foot{display:flex; justify-content:space-between; gap:12px; margin-top:28px; padding-top:14px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted)}
mark.anc{background:transparent; color:inherit; border-bottom:2px solid var(--c); padding-bottom:1px; cursor:pointer; border-radius:2px; transition:background .15s}
mark.anc:hover{background:var(--cs)}
mark.anc.on{background:var(--cs); box-shadow:0 0 0 3px var(--cs)}
.doc-text ins{background:var(--ins-bg); color:var(--ins); text-decoration:none; border-radius:3px; padding:0 2px}
.doc-text del{background:var(--del-bg); color:var(--del); border-radius:3px; padding:0 2px}
.aitag{font-family:var(--f); font-size:11px; font-weight:600; vertical-align:3px; margin-left:4px; padding:1px 6px; border-radius:999px; background:var(--ai-soft); color:var(--ai)}

/* ---------- margin / comments ---------- */
.margin{display:grid; gap:12px; align-content:start}
.mhead{display:flex; justify-content:space-between; align-items:center; gap:8px}
.mhead h2{font-size:14px; font-weight:600}
.seg{display:inline-flex; background:var(--sunken); border-radius:8px; padding:2px}
.seg button{border:0; background:none; padding:4px 10px; border-radius:6px; font-size:12.5px; font-weight:500; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; transition:border-color .15s, box-shadow .15s}
.card:hover{border-color:var(--line-2)}
.card.on{border-color:var(--line-2); box-shadow:var(--shadow)}
.chead{display:flex; gap:10px; align-items:flex-start; padding:14px 14px 0; cursor:pointer; background:none; border:0; width:100%; text-align:left}
.av{width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:700; flex:none}
.av.ai{background:var(--ai-soft); color:var(--ai)} .av.peer{background:var(--peer-soft); color:var(--peer)} .av.me{background:var(--accent-soft); color:var(--accent)}
.cwho{flex:1; min-width:0}
.cwho b{font-size:13.5px; font-weight:600}
.cwho span{display:block; font-size:12px; color:var(--muted); margin-top:1px}
.pill{font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:999px; white-space:nowrap; border:1px solid var(--line-2); color:var(--muted)}
.pill.accept{background:var(--good-soft); color:var(--good); border-color:transparent}
.pill.adapt{background:var(--accent-soft); color:var(--accent); border-color:transparent}
.pill.reject{background:var(--bad-soft); color:var(--bad); border-color:transparent}
.cbody{padding:8px 14px 14px 52px; display:grid; gap:10px}
.ctext{font-size:14px; line-height:1.55; color:var(--ink-2)}
.card:not(.on) .ctext{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.thread{display:grid; gap:10px; padding-top:4px}
.msg{display:grid; gap:4px}
.msg .by{font-size:11.5px; font-weight:600; color:var(--muted)}
.bubble{font-size:13.5px; line-height:1.55; padding:9px 12px; border-radius:10px}
.msg.ai .bubble{background:var(--ai-soft)} .msg.peer .bubble{background:var(--peer-soft)} .msg.me .bubble{background:var(--sunken)}
.signal{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted)}
.signal i{width:7px; height:7px; border-radius:50%; background:var(--c); display:block}
.signal.warn{color:var(--warn)}
details.why{font-size:12px; color:var(--muted)}
details.why summary{cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:4px}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:"›"; display:inline-block; transition:transform .15s; font-size:14px; line-height:1}
details.why[open] summary::before{transform:rotate(90deg)}
details.why p{margin-top:6px; padding:8px 10px; background:var(--sunken); border-radius:8px; color:var(--ink-2)}
details.why code{font-family:var(--m); font-size:11px; color:var(--accent)}
.composer{border:1px solid var(--line-2); border-radius:10px; background:var(--surface); display:flex; align-items:flex-end; gap:6px; padding:6px 6px 6px 12px; transition:border-color .15s, box-shadow .15s}
.composer:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{flex:1; border:0; outline:0; resize:none; background:none; font-size:13.5px; line-height:1.5; padding:5px 0; min-height:22px; max-height:160px}
.send{width:30px; height:30px; border-radius:8px; border:0; display:grid; place-items:center; background:var(--accent); color:var(--accent-ink); flex:none}
.send:disabled{background:var(--line-2); color:var(--muted); cursor:not-allowed}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 10px; font-size:12.5px; font-weight:500; color:var(--ink-2)}
.chip:hover{border-color:var(--line-2); background:var(--sunken)}
.decide{display:grid; gap:8px; padding-top:10px; border-top:1px solid var(--line)}
.decide .lbl{font-size:12px; font-weight:600; color:var(--muted)}
.dseg{display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line-2); border-radius:9px; overflow:hidden}
.dseg button{border:0; background:var(--surface); padding:7px 6px; font-size:13px; font-weight:500; color:var(--ink-2)}
.dseg button + button{border-left:1px solid var(--line-2)}
.dseg button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.reason{width:100%; border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; background:var(--surface)}
.reason:focus{outline:0; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.typing{display:inline-flex; gap:3px; padding:4px 0} .typing i{width:5px; height:5px; border-radius:50%; background:var(--muted); animation:blink 1s infinite} .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.empty{border:1px dashed var(--line-2); border-radius:12px; padding:22px; display:grid; gap:14px; background:transparent}
.empty h3{font-size:14px; font-weight:600}
.feat{display:grid; grid-template-columns:28px minmax(0,1fr); gap:10px; align-items:start; font-size:13px; color:var(--ink-2)}
.feat .ic{width:28px; height:28px; border-radius:8px; display:grid; place-items:center; background:var(--sunken); color:var(--ink-2)}
.feat b{display:block; color:var(--ink); font-weight:600}
.addpeer{display:grid; gap:8px; padding:14px; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
.addpeer select, .addpeer textarea{width:100%; border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; background:var(--surface)}
.linkbtn{border:0; background:none; color:var(--accent); font-size:13px; font-weight:600; padding:4px 0; justify-self:start}

/* ---------- review ---------- */
.summary{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; display:grid; grid-template-columns:repeat(3,1fr); gap:0}
.summary div{padding:0 12px; border-left:1px solid var(--line)} .summary div:first-child{border-left:0; padding-left:0}
.summary b{display:block; font-size:22px; font-weight:650; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.summary span{font-size:12px; color:var(--muted)}
.jcard{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; display:grid; gap:10px}
.jtop{display:flex; gap:10px; align-items:center}
.jtop .cwho b{font-size:13px}
.verdict{font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px}
.verdict.good{background:var(--good-soft); color:var(--good)} .verdict.warn{background:var(--warn-soft); color:var(--warn)} .verdict.eval{background:var(--ai-soft); color:var(--c-eval)} .verdict.other{background:var(--sunken); color:var(--muted)}
.path{display:grid; grid-template-columns:repeat(5,1fr); gap:4px}
.path span{height:4px; border-radius:2px; background:var(--line)}
.path span.on{background:var(--accent)}
.pathlbl{display:grid; grid-template-columns:repeat(5,1fr); gap:4px; font-size:10.5px; color:var(--muted)}
.jnote{font-size:12.5px; color:var(--ink-2)}
.reflect{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; display:grid; gap:14px}
.reflect label{font-size:13px; font-weight:600; display:grid; gap:6px}
.reflect textarea{border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-height:70px; resize:vertical; font-size:13.5px; font-weight:400; background:var(--surface)}
.reflect textarea:focus{outline:0; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.note{font-size:12.5px; color:var(--muted); background:var(--sunken); border-radius:8px; padding:10px 12px}
.note.ok{background:var(--good-soft); color:var(--good)}

/* ---------- drawer & popover ---------- */
.scrim{position:fixed; inset:0; background:rgba(12,18,15,.32); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(420px, 100vw); z-index:41; background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow-lg); transform:translateX(100%); transition:transform .25s cubic-bezier(.2,.7,.2,1); display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none}
.dhead{display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid var(--line)}
.dhead h2{font-size:16px; font-weight:650}
.dbody{padding:20px; overflow-y:auto; display:grid; gap:24px; align-content:start}
.dsec{display:grid; gap:10px}
.dsec h3{font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.big{display:flex; align-items:center; gap:16px}
.big b{font-size:30px; font-weight:650; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.big p{font-size:13px; color:var(--muted)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.stat{background:var(--sunken); border-radius:10px; padding:12px}
.stat b{display:block; font-size:20px; font-weight:650; font-variant-numeric:tabular-nums}
.stat span{font-size:12px; color:var(--muted)}
.bars{display:grid; gap:8px; font-size:12.5px}
.barrow{display:grid; grid-template-columns:44px minmax(0,1fr); gap:10px; align-items:center}

<script>
(function(){
"use strict";
/* ================= utilities ================= */
var $ = function(s, r){ return (r||document).querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function sentences(t){ return (String(t||'').replace(/\s+/g,' ').trim().match(/[^.!?]+[.!?]+["”’)]*|[^.!?]+$/g) || []).map(function(s){ return s.trim(); }).filter(Boolean); }
function toks(t){ return String(t||'').toLowerCase().replace(/[^a-z0-9%\s']/g,' ').split(/\s+/).filter(Boolean); }
function jac(a,b){ var A=new Set(toks(a)), B=new Set(toks(b)); if(!A.size&&!B.size) return 1; var i=0; A.forEach(function(x){ if(B.has(x)) i++; }); return i/(A.size+B.size-i); }
function grams(t,n){ var w=toks(t), g=[]; for(var i=0;i+n<=w.length;i++) g.push(w.slice(i,i+n).join(' ')); return g; }
function words(t){ return toks(t).length; }
function uid(){ return Math.random().toString(36).slice(2,9); }
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
function store(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }

/* ================= constants ================= */
var CODES = {
  ACK:{name:'Acknowledgment', color:'var(--c-ack)', icap:'Active'},
  DIFF:{name:'Noticing difficulty', color:'var(--c-diff)', icap:'Active+'},
  REASON:{name:'Explanation', color:'var(--c-reason)', icap:'Constructive'},
  EVAL:{name:'Critical evaluation', color:'var(--c-eval)', icap:'Constructive'},
  TRANSFER:{name:'Transfer', color:'var(--c-transfer)', icap:'Constructive'},
  OTHER:{name:'Other / off-task', color:'var(--c-other)', icap:'—'}
};
var LEVELS = ['L0 · no intervention','L1 · metacognitive prompt','L2 · locate','L3 · strategy hint','L4 · concept explanation','L5 · modelled revision'];
var TYPES = {'claim-evidence':'Claim–evidence link','counterargument':'Counterargument','cohesion':'Cohesion','specificity':'Specificity','organization':'Organization','language':'Language use'};
var TASK = 'Should schools move more classes online? Write a short argumentative paragraph (120–180 words) with a clear claim, evidence, and a response to one counterargument.';
var SAMPLE = 'Online classes are better for students than traditional classes. A 2023 survey found that 70% of teachers prefer using online tools. Students can study at home, so they save time. However, some people think online classes are boring. In conclusion, schools should move all classes online.';
var PRESET_AI = [
  {type:'claim-evidence', anchor:'A 2023 survey found that 70% of teachers prefer using online tools.', text:'Your evidence is about teachers, but your claim is about students. Take another look at how this survey connects to what you say about students.'},
  {type:'counterargument', anchor:'However, some people think online classes are boring.', text:'You raise a counterargument here, but the paragraph moves on without responding to it.'},
  {type:'cohesion', anchor:'Students can study at home, so they save time.', text:'This point about saving time is not yet connected back to why online classes are "better".'}
];
var PRESET_PEER = [
  {type:'organization', anchor:'In conclusion, schools should move all classes online.', text:'"All classes" feels really strong to me. I\'m not sure your paragraph proves that much.'},
  {type:'specificity', anchor:'Online classes are better for students than traditional classes.', text:'Your first sentence is clear, I knew your position right away. Maybe say better in what way?'}
];
var TEMPLATES = {
  metacog:'Before changing anything: which sentence do you think this comment is about, and what is the problem there?',
  explain_change:'Before you move on: which part of the original sentence was the problem, and how will your revision fix it?',
  probe_disagree:'That is your call to make. What in your paragraph already does what the comment asks? Point to the words.',
  confirm:'That reasoning works. You know what to change, so make it your way.',
  handback:'Okay, over to you. Come back if you want another look.',
  locate:{ 'claim-evidence':'Put your claim and your evidence side by side. Who is the evidence about, and who is the claim about?', 'counterargument':'Find the sentence where you mention the other side. What comes right after it?', 'cohesion':'Look at how this sentence connects to your main claim. Is that link written down, or only in your head?', _:'Reread the highlighted sentence. What is it trying to do in the paragraph?' },
  strategy:{ 'claim-evidence':'Try one of two moves: narrow the claim to what the evidence shows, or add a sentence explaining how the evidence supports the claim.', 'counterargument':'A common pattern is to concede, then respond: admit what is true about the other view, then explain why your claim still holds.', 'cohesion':'Add a short linking phrase or sentence that says why this point supports your claim (for example, "This matters because…").', _:'Say in one sentence what this part should do, then check whether the text does it.' },
  concept:{ 'claim-evidence':'A claim–evidence link means the evidence is about the same thing as the claim, and you explain why it supports it. Data about teachers cannot directly prove something about students.', 'counterargument':'A counterargument strengthens an argument only when you answer it. Mentioning it without a response can make your position look weaker.', 'cohesion':'Cohesion is how sentences connect. Readers need the link between a point and the claim to be stated, not guessed.', _:'Each sentence should serve the claim. If its role is unclear, readers lose the thread.' },
  model:{ 'claim-evidence':'One direction (write it in your own words): "Online classes can make learning more flexible. In a 2023 survey, 70% of teachers preferred online tools, which suggests…" Then explain what this means for students.', 'counterargument':'One direction (write it in your own words): "Some people find online classes boring. However, interactive tools such as… can keep students engaged."', 'cohesion':'One direction (write it in your own words): "…so they save time, which they can use for…" Then link it back to your claim.', _:'One direction: restate the point and add a sentence that links it to your claim. Then explain the change in your own words.' }
};

/* ================= capabilities ================= */
var sample = null, db = null, user = null, me = { id:null, canEdit:false };
function setStatus(){
  var on = !!sample;
  $('#ai-dot').classList.toggle('on', on);
  $('#ai-label').textContent = on ? 'AI coach live (Claude)' : (window.claude ? 'Offline mode · rule-based coach' : 'Web demo · rule-based coach');
}
setTimeout(function(){ if(!sample) setStatus(); }, 11000);
if (window.claude && window.claude.use){
  window.claude.use('sample').then(function(s){ sample = s; setStatus(); }).catch(function(){ setStatus(); });
  window.claude.use('user').then(function(u){
    user = u; if(!u) return;
    Promise.all([u.id().catch(function(){return null;}), u.canEdit().catch(function(){return false;})]).then(function(r){ me.id = r[0]; me.canEdit = !!r[1]; renderTeacher(); });
  }).catch(function(){});
  window.claude.use('db').then(function(d){ db = d; if (d) subscribeSessions(); renderStudent(); }).catch(function(){});
} else { setTimeout(setStatus, 50); }

function llm(prompt, tier){
  if (!sample) return Promise.reject({code:'offline'});
  return sample.json(prompt, {modelTier: tier || 'quick'});
}

/* ================= student state ================= */
function fresh(){
  return { step:1, task:TASK, draft:SAMPLE, revision:'', style:'questions', paused:false, lane:'all',
    items:[], open:null, helpLog:[], levelTrail:[], aiTexts:[], analysis:null, reflection:{changed:'',kept:'',ai:''}, submitted:null, busy:false, peerDraft:'' };
}
var S = load('fp-studio-v2') || fresh();
S.busy = false;
function save(){ store('fp-studio-v2', S); }

/* ================= coding ================= */
function heuristicCode(text){
  var t = text.toLowerCase().trim();
  var m;
  if (/(also|same (problem|thing)|other paragraph|elsewhere|next time|in general)/.test(t) && /(should|will|could|need)/.test(t)) return {code:'TRANSFER', evidence:(t.match(/(also[^.?!]*|other paragraph[^.?!]*|next time[^.?!]*)/)||[text])[0]};
  if (m = t.match(/(i disagree|i don'?t think so|already|but i (think|meant)|not (really )?true)[^.?!]*/)) return {code:'EVAL', evidence:m[0]};
  if (m = t.match(/(because|since|so that|, so |which means|the problem is|it doesn'?t|this shows|that'?s why|affects|matters because|in order to)[^.?!]*/)) return {code:'REASON', evidence:m[0]};
  if (m = t.match(/(i don'?t (understand|get|know)|why is|what do you mean|confus|not sure|unclear)[^.?!]*/)) return {code:'DIFF', evidence:m[0]};
  if (/\?$/.test(t)) return {code:'DIFF', evidence:text};
  if (m = t.match(/^(ok|okay|sure|got it|yes|yeah|fine|will do|i'?ll (change|fix)|thanks|thank you)[^.?!]*/)) return {code:'ACK', evidence:m[0]};
  if (words(t) <= 5) return {code:'ACK', evidence:text};
  return {code:'OTHER', evidence:text};
}
function codeTurn(item, text){
  var prior = item.thread.filter(function(x){ return x.who!=='student'; }).slice(-1)[0];
  var prompt = 'You are coding a student\'s reply to writing feedback, using a research codebook. Code only observable evidence, never infer hidden thinking.\n'
   + 'Codes: ACK (simple acceptance, little reasoning), DIFF (notices a difficulty or asks for clarification), REASON (explains why or how, linking feedback to the text), EVAL (critically evaluates or disagrees with reasons), TRANSFER (applies the feedback beyond this spot), OTHER.\n'
   + 'Feedback type: ' + item.type + '\nFeedback/previous turn: "' + (prior?prior.text:item.text) + '"\nTarget sentence: "' + item.anchor + '"\nStudent reply: "' + text + '"\n'
   + 'Also judge "accurate": for REASON or EVAL, is the student\'s reasoning consistent with the actual problem in the target sentence (true/false)? Otherwise null.\n'
   + 'Return JSON only: {"code":"ACK|DIFF|REASON|EVAL|TRANSFER|OTHER","evidence":"exact substring of the student reply","accurate":true|false|null,"confidence":0-1,"rationale":"max 15 words"}';
  return llm(prompt,'quick').then(function(r){
    if (!r || !CODES[r.code]) throw 0;
    return { code:r.code, evidence: (r.evidence && text.indexOf(r.evidence)>-1) ? r.evidence : text, accurate: (r.accurate===true||r.accurate===false)?r.accurate:null, confidence: typeof r.confidence==='number'?r.confidence:null, rationale:r.rationale||'', by:'llm' };
  }).catch(function(){ var h = heuristicCode(text); return { code:h.code, evidence:h.evidence, accurate:null, confidence:null, rationale:'keyword rules (offline)', by:'rules' }; });
}

/* ================= scaffolding policy (explicit) ================= */
function moveFor(level){ return ['handback','metacog','locate','strategy','concept','model'][level]; }
function policy(item, coded, help){
  var lv = item.level, move, why;
  if (help === 'done'){ lv = 0; move = 'handback'; why = 'Student says they have it. Control goes back to the student.'; }
  else if (help === 'executive'){ item.exec = (item.exec||0)+1; lv = clamp(Math.max(lv,3) + (item.exec>=2?1:0) + (item.exec>=3?1:0), 0, 5); move = moveFor(lv); why = 'Asked for the answer (executive help-seeking, request #' + item.exec + '). Strategy first; a modelled revision only after repeated requests.'; }
  else if (help === 'instrumental'){ lv = clamp(Math.max(lv,1)+1, 1, 4); move = moveFor(lv); why = 'Asked to understand (instrumental help-seeking). Step up one level.'; }
  else if (help === 'example'){ lv = 4; move = 'concept'; why = 'Asked for an example. Concept explanation with an example, still no rewrite.'; }
  else {
    var c = coded.code;
    if (c === 'ACK'){ item.ack = (item.ack||0)+1; lv = 1; move = 'explain_change'; why = 'Accepted without explaining. Unexplained acceptance is weak evidence, so the coach asks for reasoning.'; }
    else if (c === 'DIFF'){ lv = clamp(Math.max(2, lv+1), 2, 4); move = moveFor(lv); why = 'Noticed a difficulty. Step up support.'; }
    else if (c === 'REASON' || c === 'TRANSFER'){
      if (coded.accurate === false){ lv = 4; move = 'concept'; why = 'Explains, but the reasoning misses the problem (possible misconception). Concept explanation.'; }
      else { item.acc = (item.acc||0)+1; S.streak = (S.streak||0)+1; lv = clamp(lv-1, 0, 5); if (S.streak>=3) lv = 0; move = lv<=1 ? 'confirm' : moveFor(lv); why = 'Accurate explanation (' + S.streak + ' in a row). Support fades' + (S.streak>=3?' to none after three.':'.'); }
    }
    else if (c === 'EVAL'){ lv = 1; move = 'probe_disagree'; why = 'Disagrees. Ask for evidence from the text; the student may keep their choice.'; }
    else { lv = 2; move = 'locate'; why = 'Unclear reply. Point back to the relevant sentence.'; }
  }
  if (help || coded.code==='ACK' || coded.code==='DIFF' || coded.accurate===false) S.streak = (help==='done') ? S.streak : 0;
  item.level = lv;
  S.levelTrail.push({level:lv, item:item.id});
  return {level:lv, move:move, why:why};
}
function templateFor(move, type){ var t = TEMPLATES[move]; return typeof t === 'string' ? t : (t[type] || t._); }
function phrase(item, decision){
  var fallback = templateFor(decision.move, item.type);
  if (!sample) return Promise.resolve({text:fallback, by:'template'});
  var history = item.thread.slice(-6).map(function(x){ return (x.who==='student'?'Student':'Coach') + ': ' + x.text; }).join('\n');
  var rules = {
    handback:'Hand control back in one short sentence. No new feedback.',
    confirm:'Affirm the student\'s reasoning briefly and hand the revision back to them. Do not add suggestions.',
    metacog:'Ask one metacognitive question that makes the student locate and name the problem themselves. No hints about the fix.',
    explain_change:'Ask the student to explain which part of the original sentence was problematic and how their revision will address it.',

  return '<article class="doc"><div class="doc-title">Final paragraph</div><div class="doc-text">' + finalText() + '</div>' + foot(words(S.revision) + ' words', S.check && S.check.target ? '<span style="background:var(--warn-soft);padding:0 6px;border-radius:3px">highlighted</span> = the decision you are explaining' : '') + '</article>';

function anchoredText(text){
  var sents = sentences(text);
  return sents.map(function(s){
    var its = S.items.filter(function(it){ return jac(s, it.anchor) > 0.6; });
    if (!its.length) return esc(s);
    var it = its.filter(function(x){ return x.id===S.open; })[0] || its[0];
    var c = it.source==='ai' ? 'var(--ai)' : 'var(--peer)', cs = it.source==='ai' ? 'var(--ai-soft)' : 'var(--peer-soft)';
    return '<mark class="anc' + (its.some(function(x){ return x.id===S.open; })?' on':'') + '" style="--c:' + c + '; --cs:' + cs + '" data-act="open" data-id="' + it.id + '" tabindex="0" role="button" aria-label="Open comment on this sentence">' + esc(s) + '</mark>';
  }).join(' ');
}
function diffRuns(a, b){
  var x = a.split(/\s+/), y = b.split(/\s+/), n = x.length, m = y.length, L = [], i, j;
  for (i=0;i<=n;i++) L.push(new Array(m+1).fill(0));
  for (i=n-1;i>=0;i--) for (j=m-1;j>=0;j--) L[i][j] = x[i].toLowerCase()===y[j].toLowerCase() ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  var ops = []; i=0; j=0;
  while (i<n && j<m){ if (x[i].toLowerCase()===y[j].toLowerCase()){ ops.push(['=',y[j]]); i++; j++; } else if (L[i+1][j]>=L[i][j+1]) ops.push(['-',x[i++]]); else ops.push(['+',y[j++]]); }
  while (i<n) ops.push(['-',x[i++]]); while (j<m) ops.push(['+',y[j++]]);
  var out = [], k = 0;
  while (k < ops.length){
    var kind = ops[k][0], run = [];
    while (k < ops.length && ops[k][0]===kind){ run.push(ops[k][1]); k++; }
    var txt = esc(run.join(' '));
    out.push(kind==='=' ? txt : (kind==='+' ? '<ins>'+txt+'</ins>' : '<del>'+txt+'</del>'));
  }
  return out.join(' ');
}
function diffText(){
  var A = S.analysis, out = [];
  var byB = {}; A.pairs.forEach(function(p){ if (p.b>-1) byB[p.b] = p; });
  var dels = A.pairs.filter(function(p){ return p.kind==='deleted'; });
  A.B.forEach(function(s, j){
    var p = byB[j]; var tag = p && p.app && p.app.kind!=='own' ? '<span class="aitag">' + (p.app.kind==='verbatim'?'AI wording':'adapted from AI') + '</span>' : '';
    if (!p || p.kind==='same') out.push(esc(s));
    else if (p.kind==='modified') out.push(diffRuns(A.A[p.a], s) + tag);
    else out.push('<ins>' + esc(s) + '</ins>' + tag);
  });
  dels.forEach(function(p){ out.push('<del>' + esc(A.A[p.a]) + '</del>'); });
  return out.join(' ');
}

    + '<span class="cwho"><b>' + esc(srcName(it)) + '</b><span>' + esc(TYPES[it.type]||it.type) + '</span></span>'
    + '<span class="pill ' + (d?d.kind:'') + '">' + (d ? {accept:'Accepted',adapt:'Adapted',reject:'Rejected'}[d.kind] : 'Open') + '</span></button>'
    + '<div class="cbody"><p class="ctext">' + esc(it.text) + '</p>';

        else h += '<span class="typing"><i></i><i></i><i></i></span>';
        h += '</div>';

        h += '<div class="msg ' + t.who + '"><span class="by">' + (t.who==='ai'?'AI coach':esc(srcName(it))) + '</span><div class="bubble">' + esc(t.text) + '</div>'
          + (t.why ? '<details class="why"><summary>Why this response?</summary><p><code>' + esc(LEVELS[t.level]) + '</code><br>' + esc(t.why) + '</p></details>' : '') + '</div>';

function reviewMargin(){

function journeyCard(it){
  var q = quadrant(it), talk = lastStudentCode(it), al = it.align || {};

  if (talk) bits.push('You ' + SHORT[talk].toLowerCase().replace('accepted','accepted it'));
  if (it.decision) bits.push(it.decision.kind + (it.decision.kind==='reject'?'ed':(it.decision.kind==='adapt'?'ed':'ed')));
  if (al.app && al.app!=='own') bits.push('used ' + al.app + ' AI wording');
  return '<div class="jcard"><div class="jtop">' + avatar(it.source, it) + '<span class="cwho"><b>' + esc(TYPES[it.type]||it.type) + '</b><span>' + esc(srcName(it)) + '</span></span><span class="verdict ' + q.tone + '">' + esc(q.label) + '</span></div>'
    + '<div class="path">' + steps.map(function(s){ return '<span class="' + (s?'on':'') + '"></span>'; }).join('') + '</div><div class="pathlbl"><span>Given</span><span>Discussed</span><span>Decided</span><span>Revised</span><span>Improved</span></div>'

/* ---------- insights drawer ---------- */
function sparkline(trail, w, h){
  w = w||340; h = h||90; if (!trail.length) return '<p class="muted" style="font-size:13px">Appears once the coach starts responding.</p>';
  var n = trail.length, x = function(i){ return 26 + (n===1?0:i*(w-36)/(n-1)); }, y = function(l){ return 10 + (5-l)*(h-22)/5; };
  var pts = trail.map(function(l,i){ return x(i)+','+y(l); }).join(' ');
  var grid = [0,1,2,3,4,5].map(function(l){ return '<line x1="24" x2="' + w + '" y1="' + y(l) + '" y2="' + y(l) + '" stroke="var(--line)" stroke-width="1"/>'; }).join('');
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Support level over turns: ' + trail.join(', ') + '">' + grid + '<text x="0" y="' + (y(5)+4) + '" font-size="10" fill="var(--muted)">L5</text><text x="0" y="' + (y(0)+4) + '" font-size="10" fill="var(--muted)">L0</text><polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/><circle cx="' + x(n-1) + '" cy="' + y(trail[n-1]) + '" r="4" fill="var(--accent)"/></svg>';
}
function codeStack(counts){
  var keys = Object.keys(CODES), tot = keys.reduce(function(a,k){ return a+(counts[k]||0); },0);
  if (!tot) return '<div class="stack"></div>';
  return '<div class="stack">' + keys.map(function(k){ var v = counts[k]||0; return v ? '<i style="width:' + (100*v/tot) + '%; background:' + CODES[k].color + '" title="' + SHORT[k] + ': ' + v + '"></i>' : ''; }).join('') + '</div>';
}
function legend(){ return '<div class="legend">' + Object.keys(CODES).filter(function(k){ return k!=='OTHER'; }).map(function(k){ return '<span style="--c:' + CODES[k].color + '">' + SHORT[k] + '</span>'; }).join('') + '</div>'; }
function renderDrawer(){

  var rows = _demoClass();
  var demo = [
    {target:{kind:'change', before:'A 2023 survey found that 70% of teachers prefer using online tools.', after:'A 2023 survey found that 70% of teachers prefer online tools, which suggests schools are ready for the change.', app:'own'}, a1:'The comment said my evidence was about teachers, so I connected it to schools instead of students.', a2:'Because teachers run the classes, their readiness matters for whether online classes work, so it still supports my claim.', challenge:'Does teacher readiness really show that online classes are better for students?', m1:{voice:true}, m2:{voice:true}, code1:'REASON', code2:'EVAL', verdict:'defended', note:'Clear reasons both times, and you answered the challenge directly.'},
    {target:{kind:'change', before:'However, some people think online classes are boring.', after:'However, interactive tools such as polls and breakout rooms can keep students engaged.', app:'verbatim'}, a1:'It sounds better.', a2:'I think it is better now.', challenge:'Parts of this sentence match the AI coach’s wording. Without the AI, how would you explain why this version is better?', m1:{typed:true}, m2:{typed:true}, code1:'ACK', code2:'ACK', verdict:'not_yet', note:'Try explaining what problem the original sentence had and how the new one fixes it.'},
    {target:{kind:'kept', sentence:'In conclusion, schools should move all classes online.'}, a1:'I want a strong conclusion because my paragraph is persuasive.', a2:'Maybe all is too strong, but my point is that online is better.', challenge:'Your classmate says “all classes” goes beyond your evidence. What in your paragraph proves that much?', m1:{voice:true}, m2:{voice:true,typed:true}, code1:'REASON', code2:'DIFF', verdict:'partly', note:'Good reason at first; the challenge shows your claim may be stronger than your evidence.'}
  ];
  if (rows[0]) rows[0].check = Object.assign({stage:3}, demo[0]);
  if (rows[1]) rows[1].check = Object.assign({stage:3}, demo[1]);
  if (rows[3]) rows[3].check = Object.assign({stage:3}, demo[2]);
  return rows;
};
var _flagsFor = flagsFor;
flagsFor = function(st){
  var f = _flagsFor(st);
  if (st.check && st.check.verdict === 'not_yet') f.unshift({t:'Could not defend a revision decision', s:'Ask them to talk through that change in a short conference.'});
  return f;
};
/* voice input: claude.ai dictation, else the browser's speech recognition */
var Voice = { d:null, rec:null, live:null, disabled:false, SR: window.SpeechRecognition || window.webkitSpeechRecognition || null };
Voice.available = function(){ if (Voice.disabled) return false; if (Voice.d) return true; return !!(Voice.SR && !window.claude); };
Voice.append = function(field, txt){
  if (!S.check || !txt) return;
  var cur = S.check[field] || '', add = cur ? txt : txt.replace(/^\s+/, '');
  if (cur && !/^\s/.test(add) && !/\s$/.test(cur)) add = ' ' + add;
  S.check[field] = cur + add;
  var mk = field==='a1'?'m1':'m2'; S.check[mk] = S.check[mk] || {}; S.check[mk].voice = true; save();
  var ta = document.getElementById('check-' + field); if (ta){ ta.value = S.check[field]; grow(ta); }
  var nb = $('[data-act="check-next"]'); if (nb) nb.disabled = words(S.check[field]) < 3;
};
Voice.partial = function(field, txt){ var el = document.getElementById('partial-' + field); if (el) el.textContent = txt ? txt + '…' : ''; };
Voice.stop = function(){ if (!Voice.live) return; try { if (Voice.d) Voice.d.stop(); else if (Voice.rec) Voice.rec.stop(); } catch(e){} };
if (window.claude && window.claude.use){
  window.claude.use('dictation').then(function(d){
    if (!d) return; Voice.d = d;
    d.onFinal(function(e){ if (Voice.live) Voice.append(Voice.live, e.text); });
    d.onPartial(function(e){ if (Voice.live) Voice.partial(Voice.live, e.text); });
    d.onState(function(e){ if (e.state === 'idle'){ if (Voice.live) Voice.partial(Voice.live, ''); Voice.live = null; if (e.reason==='unavailable' || e.reason==='not_granted') Voice.disabled = true; if (e.reason==='rate_limited' || e.reason==='upstream_error') toast('Voice input stopped. Try again, or type your answer.'); renderStudent(); } });
    if (S.step === 5) renderStudent();
  }).catch(function(){});
}
function toggleMic(field){
  if (Voice.live === field){ Voice.stop(); return; }
  if (Voice.live) Voice.stop();
  if (Voice.d){
    Voice.live = field;
    Voice.d.start().catch(function(err){ Voice.live = null; if (err && (err.code==='not_granted' || err.code==='unavailable')){ Voice.disabled = true; toast('Voice input is off for this page. You can type instead.'); } else if (err && err.code!=='stopped') toast('Could not start voice input. You can type instead.'); renderStudent(); });
    renderStudent(); return;
  }
  if (Voice.SR && !window.claude){
    var rec = new Voice.SR(); Voice.rec = rec; rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true;
    rec.onresult = function(e){ var interim = ''; for (var i = e.resultIndex; i < e.results.length; i++){ var r = e.results[i]; if (r.isFinal) Voice.append(field, r[0].transcript); else interim += r[0].transcript; } Voice.partial(field, interim); };
    rec.onerror = function(e){ if (e.error==='not-allowed' || e.error==='service-not-allowed'){ Voice.disabled = true; toast('Microphone access was blocked. You can type instead.'); } else if (e.error==='network'){ toast('Voice input needs a connection to the speech service. You can type instead.'); } };
    rec.onend = function(){ Voice.partial(field, ''); Voice.live = null; Voice.rec = null; renderStudent(); };
    try { rec.start(); Voice.live = field; } catch(e){ toast('Could not start voice input.'); }
    renderStudent();
  }
}

/* ================= events ================= */
function render(){ if (VIEW==='student') renderStudent(); else renderTeacher(); }
document.addEventListener('input', function(e){
  var t = e.target;
  if (t.tagName === 'TEXTAREA') grow(t);
  if (t.dataset.bind){ S[t.dataset.bind] = t.value; save();
    if (t.dataset.bind==='draft'){ var wc = $('#wc'); if (wc) wc.textContent = words(t.value); var b = $('[data-act="start"]'); if (b) b.disabled = words(t.value)<15; }
    if (t.dataset.bind==='revision'){ var wc2 = $('#wc'); if (wc2) wc2.textContent = words(t.value); var o = ownershipLive(); var ol = $('#ownlive'); if (ol) ol.textContent = o + '%'; }
  }
  if (t.dataset.reason){ var it = itemById(t.dataset.reason); if (it && it.decision){ it.decision.reason = t.value; save(); } }
  if (t.dataset.refl){ S.reflection[t.dataset.refl] = t.value; save(); }
  if (t.dataset.check && S.check){ S.check[t.dataset.check] = t.value; var mk = t.dataset.check==='a1'?'m1':'m2'; S.check[mk] = S.check[mk] || {}; if (!Voice.live) S.check[mk].typed = true; save(); var nb = $('[data-act="check-next"]'); if (nb) nb.disabled = words(t.value) < 3; }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if (t.id === 'pause'){ S.paused = t.checked; save(); renderStudent(); return; }
  if (t.dataset && t.dataset.ovr){
    var rows = classRows(), st = rows.filter(function(r){ return r.id===T.sel; })[0]; if (!st) return;
    st.overrides = st.overrides || {}; st.overrides[t.dataset.ovr] = t.value;
    if (!st._demo && db && t.dataset.doc) db.doc('sessions/' + t.dataset.doc).update({ overrides: st.overrides }).catch(function(){ toast('Could not save the correction.'); });
    renderTeacher();
  }
});
document.addEventListener('keydown', function(e){
  var t = e.target;
  if (t.dataset && t.dataset.reply && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendTurn(t.dataset.reply, t.value); return; }
  if (t.classList && t.classList.contains('anc') && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); t.click(); }
  if (e.key === 'Escape'){ if (UI.drawer){ UI.drawer=false; renderDrawer(); } else if (UI.pop){ UI.pop=false; renderTop(); } }
});
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]');
  if (UI.pop && !e.target.closest('.pop') && !(b && b.dataset.act==='toggle-pop')){ UI.pop = false; UI.confirmReset = false; renderTop(); }
  if (!b) return;
  var a = b.dataset.act, id = b.dataset.id;
  if (a==='home'){ e.preventDefault(); return; }
  if (a==='view'){ VIEW = b.dataset.view; UI.drawer=false; render(); window.scrollTo(0,0); return; }
  if (a==='open-drawer'){ UI.drawer = true; renderDrawer(); var c = $('#drawer .iconbtn'); if (c) c.focus(); return; }
  if (a==='close-drawer'){ UI.drawer = false; renderDrawer(); return; }
  if (a==='toggle-pop'){ UI.pop = !UI.pop; UI.confirmReset=false; renderTop(); return; }
  if (a==='style'){ S.style = b.dataset.style; save(); renderTop(); return; }
  if (a==='reset'){ if (UI.confirmReset){ S = fresh(); save(); UI.pop=false; UI.confirmReset=false; renderStudent(); window.scrollTo(0,0); } else { UI.confirmReset = true; renderTop(); } return; }
  if (a==='start') startFeedback();
  else if (a==='sample'){ S.draft = SAMPLE; save(); renderStudent(); }
  else if (a==='open'){ S.open = S.open===id && b.tagName==='BUTTON' ? null : id; save(); renderStudent(); var card = document.getElementById('card-'+id); if (card && b.tagName==='MARK') card.scrollIntoView({block:'nearest', behavior:'smooth'}); }
  else if (a==='lane'){ S.lane = b.dataset.lane; save(); renderStudent(); }
  else if (a==='send'){ var ta = document.querySelector('[data-reply="' + id + '"]'); if (ta && ta.value.trim()) sendTurn(id, ta.value); }
  else if (a==='help') sendTurn(id, '', b.dataset.kind);
  else if (a==='decide'){ var it = itemById(id); it.decision = {kind:b.dataset.kind, reason:(it.decision&&it.decision.reason)||'', at:Date.now()}; save(); renderStudent(); var inp = document.getElementById('reason-'+id); if (inp && b.dataset.kind==='reject') inp.focus(); }
  else if (a==='toggle-addpeer'){ UI.addPeer = !UI.addPeer; renderStudent(); }
  else if (a==='add-peer'){ var before = S.items.length; addPeer(); if (S.items.length>before) S.items[S.items.length-1].peerName = 'Classmate'; UI.addPeer = false; save(); renderStudent(); }
  else if (a==='to-revise'){ S.step = 3; if (!S.revision) S.revision = S.draft; save(); renderStudent(); window.scrollTo(0,0); }
  else if (a==='goto'){ S.step = +b.dataset.step; save(); renderStudent(); window.scrollTo(0,0); }
  else if (a==='analyse'){ analyse(); window.scrollTo(0,0); }
  else if (a==='to-reflect'){ S.step = 5; save(); renderStudent(); window.scrollTo(0,0); }
  else if (a==='mic') toggleMic(b.dataset.field);
  else if (a==='check-next') checkNext();
  else if (a==='submit'){ if (!checkDone()){ toast('Finish the decision check first.'); return; } submit(); }
  else if (a==='pick-student'){ T.sel = id || null; renderTeacher(); window.scrollTo(0,0); }
  else if (a==='src'){ T.src = b.dataset.src; T.sel = null; renderTeacher(); }
});

/* track which item is waiting on the coach */
var _send = sendTurn;
sendTurn = function(id, text, help){ S.busyItem = id; _send(id, text, help); };

render();
})();
</script>
